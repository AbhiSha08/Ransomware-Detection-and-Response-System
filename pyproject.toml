# =============================================================================
# pytest Configuration
# =============================================================================
[tool.pytest.ini_options]
testpaths       = ["tests"]
asyncio_mode    = "auto"
addopts         = [
    "--cov=backend",
    "--cov-report=term-missing",
    "--cov-report=html:htmlcov",
    "--cov-fail-under=50",
    "-v",
    "--tb=short",
]
markers = [
    "unit: Pure unit tests with no I/O or network",
    "integration: Tests requiring database or filesystem",
    "slow: Tests that take > 5 seconds to run",
]

# =============================================================================
# Coverage Configuration
# =============================================================================
[tool.coverage.run]
source          = ["backend"]
omit            = [
    "backend/database/migrations/*",
    "tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines   = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# =============================================================================
# Ruff Linter Configuration
# =============================================================================
[tool.ruff]
target-version  = "py312"
line-length     = 100
src             = ["backend", "tests"]

[tool.ruff.lint]
select  = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
    "PT",   # flake8-pytest-style
]
ignore  = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
    "S101",    # Use of `assert` (allowed in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN"]   # Relax security and annotation rules in tests

# =============================================================================
# Mypy — Static Type Checking
# =============================================================================
[tool.mypy]
python_version          = "3.12"
strict                  = true
warn_return_any         = true
warn_unused_configs     = true
disallow_untyped_defs   = true
ignore_missing_imports  = false
plugins                 = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["watchdog.*", "psutil.*", "reportlab.*"]
ignore_missing_imports = true
